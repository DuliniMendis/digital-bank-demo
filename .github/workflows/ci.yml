name: CI

on:
  pull_request:
  push:
    branches: [main, extended]

permissions:
  contents: read

jobs:
  backend:
    name: Backend (RuboCop and RSpec)
    runs-on: ubuntu-latest
    strategy:
      matrix:
        # The oldest Ruby the Gemfile allows, and the one the code is
        # developed on, which is read from backend/.ruby-version.
        ruby: ['3.3', '.ruby-version']
    defaults:
      run:
        working-directory: backend

    # A throwaway Postgres database that lives only for this run. The specs
    # tagged :database use it.
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: bank_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgres://postgres:postgres@localhost:5432/bank_test

    steps:
      - uses: actions/checkout@v5

      # Installs the Ruby version for this run and caches gems.
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: ${{ matrix.ruby }}
          working-directory: backend
          bundler-cache: true

      - name: Lint
        run: bundle exec rubocop

      - name: Test
        run: bundle exec rspec
