name: CI

on:
  pull_request:
  push:
    branches: [main, extended]

permissions:
  contents: read

jobs:
  backend:
    name: Backend (RuboCop and RSpec)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    # A throwaway Postgres database that lives only for this run. The specs
    # tagged :database use it.
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: bank_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgres://postgres:postgres@localhost:5432/bank_test

    steps:
      - uses: actions/checkout@v5

      # Reads the Ruby version from backend/.ruby-version and caches gems.
      - uses: ruby/setup-ruby@v1
        with:
          working-directory: backend
          bundler-cache: true

      - name: Lint
        run: bundle exec rubocop

      - name: Test
        run: bundle exec rspec

  frontend:
    name: Frontend (lint, test and build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v5

      # Reads the Node version from frontend/.node-version and caches the
      # downloaded packages.
      - uses: actions/setup-node@v5
        with:
          node-version-file: frontend/.node-version
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      # `npm ci` installs exactly what package-lock.json lists.
      - name: Install
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm test

      # Also runs the TypeScript compiler, so a type error fails the build.
      - name: Build
        run: npm run build
