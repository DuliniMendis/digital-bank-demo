name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  backend:
    name: Backend (RuboCop and RSpec)
    runs-on: ubuntu-latest
    strategy:
      matrix:
        # The oldest Ruby the Gemfile allows, and the one the code is
        # developed on, which is read from backend/.ruby-version.
        ruby: ['3.3', '.ruby-version']
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v5

      # Installs the Ruby version for this run and caches gems.
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: ${{ matrix.ruby }}
          working-directory: backend
          bundler-cache: true

      - name: Lint
        run: bundle exec rubocop

      - name: Test
        run: bundle exec rspec
