plugins:
  - rubocop-rspec

AllCops:
  NewCops: enable
  SuggestExtensions: false
  Exclude:
    - 'vendor/**/*'

# Integration specs describe a whole flow, not one class.
RSpec/DescribeClass:
  Exclude:
    - 'spec/integration/**/*'

# Keep methods short so each one does a single, readable thing.
Metrics/MethodLength:
  Max: 10
